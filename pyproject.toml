[project]
name = "campus-pulse"
version = "0.1.0"
description = "Campus crowd monitoring with a custom-trained head detector"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "pyyaml==6.0.3",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "ultralytics==8.3.253",
]

[tool.uv]
package = false
required-version = ">=0.13.7,<0.14"
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
